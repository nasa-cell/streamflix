<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar · StreamFlix</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>▶️</text></svg>">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="menu"><div class="contenedor"><a class="logo-mini" href="entrada.html"><b>S</b><b>t</b><b>r</b><b>e</b><b>a</b><b>m</b><b>F</b><b>l</b><b>i</b><b>x</b></a></div></header>
  <main class="contenedor">
    <form class="formulario panel acento aparece" id="formulario" novalidate>
      <h1>Ingresa a tu cuenta</h1>
      <p class="sub">Escribe tu usuario o tu Gmail y tu contraseña.</p>
      <div class="ejemplo-caja">¿Solo quieres probar? Usa la cuenta de ejemplo: usuario <b>demo2025</b> y contraseña <b>Demo2025x</b>.</div>
      <div class="campos">
        <div class="campo ancho">
          <label for="login">Usuario o Gmail <span class="marca obligatorio">OBLIGATORIO</span></label>
          <input class="entrada" id="login" name="login" required maxlength="40" data-solo="correo" placeholder="Ejemplo: fabian23 o fabian23@gmail.com" data-corto="Ejemplo: fabian23 o tu Gmail" autocomplete="username">
          <div class="ayuda"><span>Letras, números, punto y @.</span><span class="contador"></span></div>
        </div>
        <div class="campo ancho">
          <label for="clave">Contraseña <span class="marca obligatorio">OBLIGATORIO</span></label>
          <div class="clave-caja">
            <input class="entrada" id="clave" name="clave" type="password" required maxlength="20" data-solo="alfanum" placeholder="Ejemplo: Peli2025x" autocomplete="current-password">
            <button type="button" class="ver-clave" aria-label="Ver contraseña">👁</button>
          </div>
          <div class="ayuda"><span>8 a 20 letras y números.</span><span class="contador"></span></div>
        </div>
      </div>
      <div class="fila-intentos">
        <div class="puntos-intentos" id="puntos" aria-label="Te quedan 3 intentos"><i></i><i></i><i></i></div>
        <span class="chip-espera" id="chip-espera" hidden></span>
        <a class="olvide" href="recuperar.html">¿Olvidaste tu contraseña?</a>
      </div>
      <div class="fila-botones">
        <a class="btn btn-2" href="registro.html">Crear cuenta</a>
        <button class="btn btn-1" type="submit" id="enviar">Ingresar</button>
      </div>
    </form>
  </main>
  <script src="js/sonido.js"></script>
  <script src="js/avisos.js"></script>
  <script src="js/api.js"></script>
  <script src="js/campos.js"></script>
  <script src="js/fondo-portadas.js"></script>
  <script src="js/ingresar.js"></script>
</body>
</html>
